[package]
name = "penumbra-shell"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Material 3 Expressive Shell UI using Slint for Penumbra Mobile DE"

[lib]
path = "src/lib.rs"

[[bin]]
name = "penumbra-shell"
path = "src/main.rs"

[[bin]]
name = "penumbra-top-bar"
path = "src/bin/top_bar.rs"

[[bin]]
name = "penumbra-homescreen"
path = "src/bin/homescreen.rs"

[[bin]]
name = "penumbra-nav-bar"
path = "src/bin/nav_bar.rs"

[[bin]]
name = "penumbra-quick-settings"
path = "src/bin/quick_settings.rs"

[dependencies]
layer-shell-slint = { path = "../layer-shell-slint" }
penumbra-gestures = { path = "../penumbra-gestures" }
penumbra-services = { path = "../penumbra-services" }
slint = "1.18"
chrono = "0.4"
tokio = { version = "1.38", features = ["rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive"] }
freedesktop-desktop-entry = "0.8.4"
freedesktop-icons = "0.4.0"
walkdir = "2.5.0"
image = "0.25.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
slint-build = "1.18"
