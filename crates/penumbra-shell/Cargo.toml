[package]
name = "penumbra-shell"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Material 3 Expressive Shell UI using Slint for Penumbra Mobile DE"

[dependencies]
penumbra-gestures = { path = "../penumbra-gestures" }
penumbra-services = { path = "../penumbra-services" }
slint = "1.18"
chrono = "0.4"
tokio = { version = "1.38", features = ["rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive"] }
freedesktop-desktop-entry = "0.8.4"
freedesktop-icons = "0.4.0"
walkdir = "2.5.0"
image = "0.25.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
slint-build = "1.18"
